name: Auto Bump

on:
  schedule:
    # Run every day.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autobump.yml"
  pull_request:
    paths:
      - ".github/workflows/autobump.yml"

jobs:
  bump:
    if: github.event.repository.fork == false
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Set up Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - uses: Homebrew/actions/bump-packages@main
        continue-on-error: false
        with:
          fork: false
          token: ${{ secrets.GITHUB_TOKEN }}
          casks: >
            loon
            typeswitch
            tinycast
      # 无分支保护，直接合并；bump PR 由 bot 生成且 checksum 经过校验，无人工审核价值
      - name: 合并 bot 开出的 bump PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs="$(gh pr list --author app/github-actions --state open --json number --jq '.[].number')"
          if [ -z "$prs" ]; then
            echo "没有待合并的 bump PR"
            exit 0
          fi
          for pr in $prs; do
            echo "合并 #$pr"
            gh pr merge "$pr" --squash --delete-branch || echo "::warning::合并 #$pr 失败，需要人工处理"
          done
